services:
  - type: web
    name: khaosarn-shop
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python shop_server.py
    envVars:
      - key: RENDER
        value: "true"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: khaosarn-db
          property: connectionString
      - key: CLOUDINARY_URL
        sync: false   # ใส่เองใน dashboard

databases:
  - name: khaosarn-db
    plan: free
